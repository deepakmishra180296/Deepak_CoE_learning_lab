name: Playwright Tests CI

on:
  push:
  workflow_dispatch:

jobs:
  # Job 1: Python Playwright tests, split across shards.
  # Excluded (currently failing, see PR notes):
  #   - tests/test_selenium_login.py (selenium is not in requirements.txt)
  #   - tests/test_playwright_login_zombies.py (targets fake example.com/login)
  #   - tests/test_error_handling.py (example.com has no welcome-message element)
  #   - tests/test_advance_ui_automation.py::test_shadow_dom (strict-mode locator violation)
  playwright-python:
    name: Python Playwright (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        include:
          - shard: 1
            test_args: "tests/test_string_calculator.py tests/test_string_calculator_zombies.py tests/test_unclean_code.py"
          - shard: 2
            test_args: "tests/test_global_error.py tests/test_practice.py tests/test_retry.py tests/test_isolation.py tests/test_clean_code.py"
          - shard: 3
            test_args: "tests/test_advance_ui_automation.py --deselect tests/test_advance_ui_automation.py::test_shadow_dom"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python_exercises/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_exercises/requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Python Playwright tests (Shard ${{ matrix.shard }})
        working-directory: python_exercises
        env:
          PYTHONPATH: .
        run: |
          pytest ${{ matrix.test_args }}

      - name: Upload Python Test Report and Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-playwright-report-shard-${{ matrix.shard }}
          path: |
            python_exercises/report.html
            python_exercises/test-results/
          retention-days: 7

  # Job 2: TypeScript Cucumber (BDD) suites
  playwright-typescript-bdd:
    name: TypeScript BDD (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [greenkart-bdd, pom-design]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: typescript-exercises/${{ matrix.project }}/package-lock.json

      - name: Install Node dependencies
        working-directory: typescript-exercises/${{ matrix.project }}
        run: |
          npm ci

      - name: Install Playwright browsers
        working-directory: typescript-exercises/${{ matrix.project }}
        run: |
          npx playwright install --with-deps chromium

      - name: Run Cucumber tests (${{ matrix.project }})
        working-directory: typescript-exercises/${{ matrix.project }}
        run: |
          npx cucumber-js

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report-${{ matrix.project }}
          path: |
            typescript-exercises/${{ matrix.project }}/reports/
          retention-days: 7

  # Job 3: TypeScript Playwright Test suites (chromium only)
  playwright-typescript-spec:
    name: TypeScript Playwright Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ts-practice, api-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No package-lock.json is committed for these projects, so `npm ci` is not possible.
      - name: Install Node dependencies
        working-directory: typescript-exercises/${{ matrix.project }}
        run: |
          npm install

      - name: Install Playwright browsers
        working-directory: typescript-exercises/${{ matrix.project }}
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright tests (${{ matrix.project }})
        working-directory: typescript-exercises/${{ matrix.project }}
        run: |
          npx playwright test --project=chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            typescript-exercises/${{ matrix.project }}/playwright-report/
            typescript-exercises/${{ matrix.project }}/test-results/
          retention-days: 7
